name: Test

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install --yes luajit

      - name: Validate and test
        run: |
          luajit -b legadosync.koplugin/main.lua /tmp/main.luac
          luajit -b legadosync.koplugin/webdav.lua /tmp/webdav.luac
          luajit -b legadosync.koplugin/syncutil.lua /tmp/syncutil.luac
          luajit -b legadosync.koplugin/_meta.lua /tmp/meta.luac
          luajit tests/test_syncutil.lua
          luajit tests/test_webdav.lua
